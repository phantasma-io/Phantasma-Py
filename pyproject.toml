[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "phantasma-sdk-py"
version = "2.0.0"
description = "Typed Python SDK for Phantasma RPC, VM scripts, transactions, and Carbon wire formats"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Phantasma", email = "info@phantasma.info" }]
dependencies = [
    "cryptography>=42",
    "requests>=2.32",
]

[project.optional-dependencies]
dev = [
    "build>=1.2",
    "mypy>=1.10",
    "pytest>=8.2",
    "pytest-cov>=5",
    "ruff>=0.5",
    "types-requests>=2.32",
]

[project.urls]
Homepage = "https://github.com/phantasma-io/Phantasma-Py"
Repository = "https://github.com/phantasma-io/Phantasma-Py"

[tool.hatch.build.targets.wheel]
packages = ["src/phantasma_py"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["phantasma_py"]
